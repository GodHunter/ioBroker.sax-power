# Dependabot will run on day 2 of each month at 02:21 (Europe/Berlin timezone)
version: 2
updates:

  - package-ecosystem: 'npm'
    schedule:
      interval: 'cron'
      timezone: 'Europe/Berlin'
      cronjob: '21 2 2 * *'
    open-pull-requests-limit: 15
    assignees:
      - 'GodHunter'
    versioning-strategy: 'increase'
    directories:
      - '**/*'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'cron'
      timezone: 'Europe/Berlin'
      cronjob: '21 2 2 * *'
    open-pull-requests-limit: 15
    assignees:
      - 'GodHunter'

name: Temporary PVForecast admin patch

on:
  push:
    branches:
      - feature/strategy-foundation

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'chore(dev): apply PVForecast selector integration'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/strategy-foundation
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix src-admin ci

      - name: Patch App.tsx
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src-admin/src/App.tsx')
          text = path.read_text()

          import_anchor = '''import {
          resolveStrategyBatteryTechnicalLimits,
          } from "../../src/lib/strategyBatteryChargeCapability";
          '''
          import_replacement = import_anchor + '''
          import { PvForecastSelector } from "./PvForecastSelector";
          '''
          if import_anchor not in text:
              raise SystemExit('strategyBatteryChargeCapability import anchor not found')
          text = text.replace(import_anchor, import_replacement, 1)

          ui_anchor = '''{this.state.modbusInstances.map(option => (
          <MenuItem key={option.value} value={option.value}>
          {option.label}
          </MenuItem>
          ))}
          </TextField>
          </Box>
          '''
          ui_replacement = '''{this.state.modbusInstances.map(option => (
          <MenuItem key={option.value} value={option.value}>
          {option.label}
          </MenuItem>
          ))}
          </TextField>

          <PvForecastSelector
          socket={this.socket}
          value={
          typeof native.strategyPvForecastInstance === "string"
          ? native.strategyPvForecastInstance
          : ""
          }
          error={hasStrategyIssue("pvForecastInstance")}
          onChange={(instance) => this.updateNativeField(
          "strategyPvForecastInstance",
          instance,
          )}
          />
          </Box>
          '''
          if ui_anchor not in text:
              raise SystemExit('Modbus selector UI anchor not found')
          text = text.replace(ui_anchor, ui_replacement, 1)

          path.write_text(text)
          PY

      - name: Validate
        run: |
          npm run test:admin
          npm run test:ts
          npm run lint
          npm run build:admin
          git diff --check

      - name: Commit generated admin integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src-admin/src/App.tsx admin/
          git commit -m 'feat(admin): integrate selectable PVForecast source'
          git push origin HEAD:feature/strategy-foundation

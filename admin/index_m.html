<title>SAX Power</title>
<script>
const script = document.createElement("script");

window.registerSocketOnLoad = function registerSocketOnLoad(callback) {
window.socketLoadedHandler = callback;
};

const parts = (window.location.search || "")
.replace(/^\?/, "")
.split("&");

const query = {};

parts.forEach(item => {
const [name, value] = item.split("=");

query[decodeURIComponent(name)] = value !== undefined
? decodeURIComponent(value)
: true;
});

script.onload = function socketLoaded() {
if (typeof window.socketLoadedHandler === "function") {
window.socketLoadedHandler();
}
};

script.src = window.location.port === "3000"
? window.location.protocol +
"//" +
(query.host || window.location.hostname) +
":" +
(query.port || 8081) +
"/lib/js/socket.io.js"
: "./../../lib/js/socket.io.js";

document.head.appendChild(script);
</script>
